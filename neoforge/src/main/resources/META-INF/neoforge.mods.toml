side = "BOTH"

[[dependencies.screenshotclipboard]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.5,)"
ordering = "NONE"
side = "BOTH"

[[mixins]]
config = "screenshotclipboard-common.mixins.json"

[[mixins]]
config = "screenshotclipboard-neoforge.mixins.json"