[[mods]]
modId="screenshotclipboard"
version="${version}"
displayName="Screenshot to Clipboard"
displayURL="https://github.com/comp500/ScreenshotToClipboard"
logoFile="icon.png"
authors="comp500"
description='''
Any time you take a screenshot in the game, the image data is copied to the clipboard. You can then paste this anywhere (e.g. Discord) to upload the image and share it with others.
'''

